
name: Daily Cold Mailing Outreach

on:
  schedule:
    # 7:00 AM IST every day (01:30 UTC)
    - cron: '30 1 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - 'dry-run'
          - 'stats'
          - 'test'
          - 'now'

      test_email:
        description: 'Email address for test mode only'
        required: false
        type: string

# This workflow does not need permission to push commits.
permissions:
  contents: read

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ColdMailingAgent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ColdMailingAgent/requirements.txt

      - name: Execute Cold Mailing Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          PYTHONUNBUFFERED: "1"
          MODE: ${{ github.event.inputs.mode || 'dry-run' }}
          TEST_EMAIL: ${{ github.event.inputs.test_email || '' }}
        run: |
          set -euo pipefail

          echo "Execution mode: $MODE"

          case "$MODE" in
            stats)
              echo "Displaying campaign statistics..."
              python ColdMailingAgent/mail_agent.py --stats
              ;;

            dry-run)
              echo "Dry run selected. No outreach emails should be sent."
              python ColdMailingAgent/mail_agent.py --dry-run
              ;;

            test)
              if [ -z "$TEST_EMAIL" ]; then
                echo "Error: enter test_email when selecting test mode."
                exit 1
              fi

              echo "Sending a test email to the supplied address..."
              python ColdMailingAgent/mail_agent.py --test "$TEST_EMAIL"
              ;;

            now)
              echo "WARNING: now mode sends real outreach emails."
              python ColdMailingAgent/mail_agent.py --now
              ;;

            *)
              echo "Error: unknown execution mode: $MODE"
              exit 1
              ;;
          esac
